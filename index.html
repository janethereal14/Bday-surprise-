<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <style>
        :root {
            --pink-bg: #ffc0cb;
            --dark-pink: #ff69b4;
            --glass: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: var(--pink-bg);
            color: #333;
            overflow-x: hidden;
        }

        /* HEAVY Emoji Rainfall */
        #emoji-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .emoji {
            position: absolute;
            top: -100px;
            font-size: 3rem;
            animation: fall linear forwards;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
        }

        @keyframes fall {
            to { transform: translateY(120vh) rotate(720deg); }
        }

        /* Timer Header */
        #timer-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--dark-pink);
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        section {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        section.active { display: flex; }

        /* Paragraphs with spacing fix */
        .para-card {
            margin-bottom: 700px; /* Gap between paras */
            background: var(--glass);
            padding: 60px;
            border-radius: 40px;
            font-size: 2.5rem;
            max-width: 850px;
            text-align: center;
            border: 4px solid white;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .fade-in { opacity: 1 !important; }

        /* The "No Gap" Fix */
        .letter {
            display: inline-block;
            white-space: pre; /* Keeps spaces as actual spaces */
            opacity: 0;
            animation: letterFade 0.4s forwards;
        }

        @keyframes letterFade {
            to { opacity: 1; transform: scale(1.1); transform: scale(1); }
        }

        /* GIGANTIC Cake Section */
        #cake-section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .giant-cake {
            font-size: 25rem; /* Massive size */
            position: relative;
            line-height: 1;
            user-select: none;
        }

        .giant-flame {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8rem;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            from { opacity: 0.8; transform: translateX(-50%) scale(1); }
            to { opacity: 1; transform: translateX(-50%) scale(1.3); }
        }

        /* Side by Side Images */
        .image-row {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 90%;
            margin: 40px 0;
        }

        .image-row img {
            width: 45%;
            height: auto;
            border-radius: 25px;
            border: 10px solid white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .btn {
            background: var(--dark-pink);
            color: white;
            border: 4px solid white;
            padding: 25px 60px;
            font-size: 2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="emoji-container"></div>
    <div id="timer-header">HAPPY BIRTHDAY!</div>

    <section id="page1" class="active">
        <button class="btn" onclick="startApp()">CLICK HERE</button>
    </section>

    <section id="page2">
        <div class="scrolling-content">
            <div class="para-card" data-text="Today is all about you!"></div>
            <div class="para-card" data-text="You have been amazing since 2008."></div>
            <div class="para-card" data-text="Get ready to make a wish..."></div>
            <div class="para-card" data-text="Here comes your cake!"></div>
            
            <div id="cake-section">
                <h1 id="blow-msg" style="font-size: 4rem; color: white; text-shadow: 2px 2px 10px rgba(0,0,0,0.2);">Blow in 3...</h1>
                <div class="giant-cake">
                    <div id="flame" class="giant-flame">🔥</div>
                    🎂
                </div>
            </div>
        </div>
    </section>

    <section id="page3">
        <h1 style="font-size: 5rem; color: white;">YOU DID IT! 🥳</h1>
        <div class="image-row">
            <img src="Screenshot_2026-05-04-15-29-00-242.jpeg" alt="Pic 1">
            <img src="Screenshot_2026-05-04-15-49-55-674.jpeg" alt="Pic 2">
        </div>
        <p style="font-size: 2rem; background: white; padding: 20px; border-radius: 20px;">Keep being awesome!</p>
    </section>

    <script>
        const bday = new Date('August 14, 2008 00:00:00');
        const emojiList = ['🎉', '🎊', '🎂', '💖', '✨', '🎈', '🎁'];

        function updateClock() {
            const now = new Date();
            const diff = now - bday;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer-header').innerText = `${d} Days | ${h}h | ${m}m | ${s}s Alive`;
        }

        // Increased Emoji frequency
        function createEmoji() {
            const container = document.getElementById('emoji-container');
            for(let i=0; i<3; i++) { // Spawns 3 at once for "A LOT MORE"
                const e = document.createElement('div');
                e.className = 'emoji';
                e.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
                e.style.left = Math.random() * 100 + 'vw';
                e.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(e);
                setTimeout(() => e.remove(), 4000);
            }
        }

        function typeWriter(element) {
            const text = element.getAttribute('data-text');
            element.innerHTML = '';
            element.classList.add('fade-in');
            
            [...text].forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'letter';
                // If it's a space, ensure it renders
                span.innerText = char === ' ' ? '\u00A0' : char; 
                span.style.animationDelay = `${i * 0.04}s`;
                element.appendChild(span);
            });
        }

        function startApp() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            document.getElementById('timer-header').style.display = 'block';

            setInterval(updateClock, 1000);
            setInterval(createEmoji, 150); // Very fast emoji spawning

            // Adjusted Scroll Speed (Faster than before)
            let autoScroll = setInterval(() => {
                window.scrollBy(0, 2.5); 
                
                document.querySelectorAll('.para-card').forEach(p => {
                    const pos = p.getBoundingClientRect();
                    if(pos.top < window.innerHeight * 0.85 && !p.classList.contains('fade-in')) {
                        typeWriter(p);
                    }
                });

                const cakePos = document.getElementById('cake-section').getBoundingClientRect();
                if (cakePos.top <= 50) {
                    clearInterval(autoScroll);
                    runCakeLogic();
                }
            }, 20);
        }

        function runCakeLogic() {
            let count = 3;
            const msg = document.getElementById('blow-msg');
            const timer = setInterval(() => {
                count--;
                if(count > 0) {
                    msg.innerText = `Blow in ${count}...`;
                } else {
                    msg.innerText = "✨ MAGIC! ✨";
                    document.getElementById('flame').style.display = 'none';
                    clearInterval(timer);
                    setTimeout(() => {
                        document.getElementById('page2').classList.remove('active');
                        document.getElementById('page3').classList.add('active');
                        window.scrollTo(0,0);
                    }, 2000);
                }
            }, 1000);
        }
    </script>
</body>
  </html>
