<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <style>
        :root {
            --pink-bg: #ffc0cb;
            --dark-pink: #ff69b4;
            --glass: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--pink-bg);
            color: #333;
            overflow-x: hidden;
        }

        /* Falling Emojis */
        #emoji-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .emoji {
            position: absolute;
            top: -50px;
            font-size: 2.5rem;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Life Timer Header */
        #timer-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 182, 193, 0.9);
            backdrop-filter: blur(8px);
            padding: 15px 0;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 1000;
            display: none;
            border-bottom: 2px solid white;
        }

        section {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        section.active { display: flex; }

        /* Welcome Button */
        .btn {
            background: var(--dark-pink);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .btn:hover { transform: scale(1.05); }

        /* Paragraph Animation */
        .para-card {
            margin-bottom: 600px;
            background: var(--glass);
            padding: 50px;
            border-radius: 30px;
            font-size: 2rem;
            max-width: 700px;
            text-align: center;
            border: 2px solid white;
            opacity: 0; /* Starts hidden */
            transition: opacity 1s;
        }

        .fade-in { opacity: 1 !important; }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(10px);
            animation: letterFade 0.5s forwards;
        }

        @keyframes letterFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Full Screen Cake */
        #cake-section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #ffe4e1, #ffc0cb);
        }

        .giant-cake {
            font-size: 15rem;
            position: relative;
            line-height: 1;
        }

        .giant-flame {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5rem;
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            from { opacity: 0.8; transform: translateX(-50%) scale(1); }
            to { opacity: 1; transform: translateX(-50%) scale(1.2); }
        }

        /* Final Page Images (Side by Side) */
        .image-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin: 40px 0;
        }

        .image-row img {
            width: 45%;
            border-radius: 20px;
            border: 8px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="emoji-container"></div>
    <div id="timer-header">Calculating your journey...</div>

    <section id="page1" class="active">
        <div style="text-align: center; background: white; padding: 50px; border-radius: 40px;">
            <h1 style="font-size: 3rem;">A Journey Through Time...</h1>
            <p style="font-size: 1.2rem; color: #666;">Ready for a little trip?</p>
            <button class="btn" onclick="startApp()">Click Here</button>
        </div>
    </section>

    <section id="page2">
        <div class="scrolling-content">
            <div class="para-card" data-text="It all began on August 12, 2008."></div>
            <div class="para-card" data-text="Since that day, the world got a lot brighter."></div>
            <div class="para-card" data-text="You have created so many beautiful memories."></div>
            <div class="para-card" data-text="And today, we celebrate YOU!"></div>
            
            <div id="cake-section">
                <h1 id="blow-msg" style="font-size: 3rem; margin-bottom: 20px;">Blow in 3...</h1>
                <div class="giant-cake">
                    <div id="flame" class="giant-flame">🔥</div>
                    🎂
                </div>
            </div>
        </div>
    </section>

    <section id="page3">
        <h1 style="font-size: 4rem; color: var(--dark-pink);">Happy Birthday!</h1>
        <p style="font-size: 1.5rem;">Two of our best moments:</p>
        
        <div class="image-row">
            <img src="Screenshot_2026-05-04-15-49-55-674.jpeg" alt="Pic 1">
            <img src="Screenshot_2026-05-04-15-29-00-242.jpeg" alt="Pic 2">
        </div>

        <div style="max-width: 600px; font-size: 1.4rem; line-height: 1.6;">
            <p>You’re officially an amazing human being. I hope this year brings you as much happiness as you give to everyone around you!</p>
        </div>
    </section>

    <script>
        const bday = new Date('August 12, 2008 00:00:00');
        const emojiList = ['🎉', '🎊', '🎂', '💖', '✨', '🎈', '🧁', '🎁'];

        function updateClock() {
            const now = new Date();
            const diff = now - bday;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer-header').innerText = `You've been amazing for ${d} Days, ${h}h, ${m}m, and ${s}s!`;
        }

        function createEmoji() {
            const container = document.getElementById('emoji-container');
            const e = document.createElement('div');
            e.className = 'emoji';
            e.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
            e.style.left = Math.random() * 100 + 'vw';
            e.style.animationDuration = (Math.random() * 3 + 4) + 's';
            container.appendChild(e);
            setTimeout(() => e.remove(), 7000);
        }

        // Logic to fade letters in one by one
        function typeWriter(element) {
            const text = element.getAttribute('data-text');
            element.innerHTML = '';
            element.classList.add('fade-in');
            
            [...text].forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.innerText = char;
                span.style.animationDelay = `${i * 0.05}s`;
                element.appendChild(span);
            });
        }

        function startApp() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            document.getElementById('timer-header').style.display = 'block';

            setInterval(updateClock, 1000);
            setInterval(createEmoji, 400);

            // AUTO SCROLL
            let autoScroll = setInterval(() => {
                window.scrollBy(0, 1.2); // Slower movement
                
                // Trigger typewriter for paras as they enter view
                document.querySelectorAll('.para-card').forEach(p => {
                    const pos = p.getBoundingClientRect();
                    if(pos.top < window.innerHeight * 0.8 && !p.classList.contains('fade-in')) {
                        typeWriter(p);
                    }
                });

                // Check for Cake
                const cakePos = document.getElementById('cake-section').getBoundingClientRect();
                if (cakePos.top <= 0) {
                    clearInterval(autoScroll);
                    runCakeLogic();
                }
            }, 30);
        }

        function runCakeLogic() {
            let count = 3;
            const msg = document.getElementById('blow-msg');
            const timer = setInterval(() => {
                count--;
                if(count > 0) {
                    msg.innerText = `Blow in ${count}...`;
                } else {
                    msg.innerText = "✨ MAKE A WISH! ✨";
                    document.getElementById('flame').style.display = 'none';
                    clearInterval(timer);
                    setTimeout(() => {
                        document.getElementById('page2').classList.remove('active');
                        document.getElementById('page3').classList.add('active');
                        window.scrollTo(0,0);
                    }, 2500);
                }
            }, 1000);
        }
    </script>
</body>
      </html>
